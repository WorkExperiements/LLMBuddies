[project]
name = "buddies"
version = "0.1.0"
description = "buddies using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.117.0,<1.0.0"
]

[project.scripts]
buddies = "buddies.main:run"
run_crew = "buddies.main:run"
train = "buddies.main:train"
replay = "buddies.main:replay"
test = "buddies.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
