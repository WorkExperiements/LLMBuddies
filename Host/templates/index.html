<!DOCTYPE html>
<html>
<head>
    <title>Local LLM Chat</title>
    <style>
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .chat-messages {
            height: 400px;
            border: 1px solid #ccc;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 10px;
        }
        .input-container {
            display: flex;
            gap: 10px;
        }
        #message-input {
            flex-grow: 1;
            padding: 10px;
        }
        button {
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <h1>Chat with Local LLM</h1>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="input-container">
            <input type="text" id="message-input" placeholder="Type your message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const messagesContainer = document.getElementById('chat-messages');
            const message = input.value.trim();
            
            if (!message) return;

            // Add user message to chat
            messagesContainer.innerHTML += `<p><strong>You:</strong> ${message}</p>`;
            input.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });
                
                const data = await response.json();
                
                // Add LLM response to chat
                messagesContainer.innerHTML += `<p><strong>LLM:</strong> ${data.response}</p>`;
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            } catch (error) {
                console.error('Error:', error);
                messagesContainer.innerHTML += `<p style="color: red;">Error: Failed to get response</p>`;
            }
        }

        // Allow sending message with Enter key
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
