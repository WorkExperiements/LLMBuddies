analyze_webpage_task:
  description: >
    Use the available tool to scrape the content of the given URL.
    This tool returns a machine-readable JSON string with two fields: "raw" and "summary".

    IMPORTANT: You MUST return the output of the tool **exactly as received**.
    Do not reword it, summarize it, or wrap it in natural language.

    URL: {url}
  expected_output: >
    You MUST return the tool output exactly as it was returned.

    The tool ScrapeAndSummarizeTool returns a valid JSON string that looks like this:
    {
      "raw": "...",
      "summary": "..."
    }

    Do NOT add any commentary, explanation, or surrounding text.
    Just return the exact JSON string — nothing more.
  agent: web_extractor


qa_from_memory_task:
  description: >
    Use the MemoryLookupTool to retrieve stored content for the website at {url}.

    Once you have the memory, answer the following user question:

    {question}

    If the tool does not return any memory, say so and end the task.
  expected_output: >
    A factual, helpful answer to the user's question based entirely on the content previously stored for the given website.
    Be concise, only answer the question without including the stored contents.
  agent: memory_qa_agent