analyze_webpage_task:
  description: >
    Use the available tool to scrape the content of the given URL and summarize it in plain language.
    The tool ScrapeAndSummarizeTool returns both the full raw text and a short summary. You should store both values in memory.
    If the tool fails for whatever reason, you should report the error to the user and finish the task without retrying.
    If the tool returns a value that is not human readable, you should report the error to the user and finish the task without retrying.

    URL: {url}
  expected_output: >
    A JSON-style string with keys "raw" and "summary" representing the extracted page content. Example:
    {
      "raw": "Full text of the webpage...",
      "summary": "A short summary of the webpage..."
    }
  agent: web_extractor