analyze_webpage_task:
  description: >
    Use the available tool to scrape the content of the given URL and summarize it in plain language.
    This tool returns a machine-readable JSON string with two fields: "raw" and "summary".

    IMPORTANT: You MUST return the output of the tool **exactly as received**.
    Do not reword it, summarize it, or wrap it in natural language.

    If the tool fails or produces unreadable output, explain the failure instead.

    URL: {url}
  expected_output: >
    A JSON-style string with keys "raw" and "summary" representing the extracted page content. Example:
    {
      "raw": "Full text of the webpage...",
      "summary": "A short summary of the webpage..."
    }
  agent: web_extractor


qa_from_memory_task:
  description: >
    Use the previously stored content from this website to answer the following user question:

    {question}

    Be as specific and helpful as possible. Reference facts only from the known page content.
    If you don't have enough information, say so.

    Website: {url}
  expected_output: >
    A factual, helpful answer to the user's question based entirely on the content previously stored for the given website.
    Be concise, but make sure to include supporting details when appropriate.
  agent: memory_qa_agent